name: Propose Stable Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        description: Release Type
        options:
          - patch
          - minor
          - major
jobs:
  update_version:
    uses: neongeckocom/.github/.github/workflows/propose_semver_release.yml@FIX_FutureReleaseTag
    with:
      branch: dev
      release_type: ${{ inputs.release_type }}
      update_changelog: True
  pull_changes:
    uses: neongeckocom/.github/.github/workflows/pull_master.yml@master
    needs: update_version
